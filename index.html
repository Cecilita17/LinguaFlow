  <head>
    <meta charset="UTF-8" />

    <link rel="manifest" href="/manifest.webmanifest?v=terracotta-1" />
    <meta name="theme-color" content="#d97757" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaFlow - Chatbot de Práctica de Idiomas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Anti-flash script: apply initial theme before render to eliminate theme flicker -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('linguaflow-theme') || 'system';
          var resolved = saved;
          if (saved === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services client script for real Google OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="antialiased selection:bg-rose-500/20 selection:text-rose-900">
    <div id="root"></div>
